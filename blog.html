<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca</title>
    <meta name="description" content="Membuat Media Pembelajaran dan Asesmen Sendiri menggunakan Canva AI Code">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta property="og:url" content="https://mediapembelajaranpaikotabanjar.vercel.app/blog.html">
    <meta property="og:title" content="Membuat Media Pembelajaran dan Asesmen Sendiri menggunakan Canva AI Code">
    <meta property="og:image" content="https://mediapembelajaranpaikotabanjar.vercel.app/assets/canvaaicode.jpeg"> 
    <meta property="og:type" content="website">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm" style="background-color: var(--primary-green);">
        <div class="container">
            
            <div class="d-flex align-items-center">
                <a href="index.html" class="nav-back-btn text-decoration-none">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <span class="page-title">Ruang Baca</span>
            </div>

            <button class="navbar-toggler border-0 text-white p-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                <i class="fas fa-bars fa-lg" id="menuIcon"></i>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
                <div class="offcanvas-header bg-light">
                    <h5 class="offcanvas-title fw-bold text-success">Menu Utama</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-3">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill" href="index.html">
                                <i class="fas fa-home"></i> Beranda
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill" href="buku.html">
                                <i class="fas fa-book"></i> Buku Paket
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill active-link" href="blog.html">
                                <i class="fas fa-newspaper"></i> Ruang Baca
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <div style="height: 80px;"></div>

    <div class="container flex-grow-1 pb-5">
        
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0 py-3" placeholder="Cari judul artikel atau topik...">
                </div>
            </div>
        </div>

        <div id="blogContainer" class="row g-4">
            <div class="text-center text-muted mt-5">Sedang memuat artikel...</div>
        </div>

        <div id="notFound" class="text-center d-none mt-5">
            <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
            <p class="text-muted">Artikel yang dicari tidak ditemukan.</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let allPosts = []; // Tempat menyimpan data asli

        // 1. Ambil Data dari JSON saat halaman dibuka
        fetch('posts.json')
            .then(response => response.json())
            .then(data => {
                allPosts = data;
                displayPosts(allPosts); // Tampilkan semua di awal
            })
            .catch(error => console.error('Gagal memuat postingan:', error));

        // 2. Fungsi Menampilkan Artikel ke HTML
        function displayPosts(posts) {
            const container = document.getElementById('blogContainer');
            const notFound = document.getElementById('notFound');
            
            container.innerHTML = ''; // Bersihkan isi lama

            if (posts.length === 0) {
                notFound.classList.remove('d-none');
            } else {
                notFound.classList.add('d-none');
                
                posts.forEach(post => {
                    // Template Card Artikel
                    const html = `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden custom-card">
                                <img src="${post.gambar}" class="card-img-top" alt="${post.judul}" style="height: 200px; object-fit: cover;">
                                <div class="card-body">
                                    <span class="badge bg-warning text-dark mb-2">${post.kategori}</span>
                                    <h5 class="card-title fw-bold">${post.judul}</h5>
                                    <p class="card-text text-muted small">${post.ringkasan}</p>
                                    <a href="${post.link}" class="btn btn-outline-success btn-sm rounded-pill mt-2">
                                        Baca Selengkapnya <i class="fas fa-arrow-right ms-1"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            }
        }

        // 3. Logika Pencarian (Realtime)
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            
            // Filter data berdasarkan Judul ATAU Ringkasan ATAU Kategori
            const filteredPosts = allPosts.filter(post => {
                return post.judul.toLowerCase().includes(keyword) || 
                       post.ringkasan.toLowerCase().includes(keyword) ||
                       post.kategori.toLowerCase().includes(keyword);
            });

            displayPosts(filteredPosts);
        });
    </script>
</body>
</html>
