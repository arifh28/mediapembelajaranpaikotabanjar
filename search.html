<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Pencarian - PAIBP SD</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm" style="background-color: var(--primary-green);">
        <div class="container position-relative">
            <div class="d-flex align-items-center">
                <a href="index.html" class="nav-back-btn text-decoration-none">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <span class="page-title ms-2">Pencarian</span>
            </div>

            <div class="d-flex align-items-center ms-auto gap-2">            
                <button class="btn text-white d-lg-none" onclick="toggleSearchBar()" title="Cari Materi">
                    <i class="fas fa-search fa-lg"></i>
                </button>

                <button class="navbar-toggler border-0 text-white p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                    <i class="fas fa-bars fa-lg" id="menuIcon" style="font-size: 1.5rem;"></i>
                </button>
            </div>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
                <div class="offcanvas-header bg-light">
                    <h5 class="offcanvas-title fw-bold text-success">Menu Utama</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-3">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill" href="index.html">
                                <i class="fas fa-home"></i> Beranda
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill" href="buku.html">
                                <i class="fas fa-book"></i> Buku Paket
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill" href="blog.html">
                                <i class="fas fa-newspaper"></i> Ruang Baca
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold px-3 rounded-pill" href="banksoal.html">
                                <i class="fas fa-clipboard-list"></i> Bank Soal
                            </a>
                        </li>
                        <li class="nav-item d-none d-lg-block">
                            <button class="btn text-white" onclick="toggleSearchBar()" title="Cari Materi">
                                <i class="fas fa-search fa-lg"></i>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div id="searchBarContainer" class="bg-white border-bottom shadow-sm fixed-top p-3 d-none" style="top: 70px; z-index: 1020;">
        <div class="container">
            <div class="input-group">
                <input type="text" id="navSearchInput" class="form-control border-success" placeholder="Cari lagi..." onkeypress="handleEnter(event)">
                <button class="btn btn-success" onclick="doSearch()">
                    <i class="fas fa-search"></i> Cari
                </button>
            </div>
        </div>
    </div>
    
    <div style="height: 80px;"></div>

    <div class="container py-4 flex-grow-1">
        <h5 class="mb-4">
            Hasil pencarian untuk: <span class="fw-bold text-success" id="searchKeyword">...</span>
        </h5>

        <div class="row g-4" id="resultsContainer">
            <div class="col-12 text-center py-5">
                <i class="fas fa-spinner fa-spin fa-2x text-muted"></i>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        // Script khusus halaman ini (dijalankan setelah script.js utama)
        document.addEventListener('DOMContentLoaded', () => {
            renderSearchResults(); 
        });
    </script>
</body>
</html>
