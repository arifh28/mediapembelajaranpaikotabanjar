<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Pencarian - PAIBP SD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
        <div class="container">
            <a href="index.html" class="navbar-brand d-flex align-items-center">
                <img src="assets/logo.png" alt="Logo" width="40" height="40" class="me-2">
                <span class="text-primary fs-4">PAIBP <span class="text-success">SD</span></span>
            </a>
            <button class="navbar-toggler border-0 p-1 text-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                <i class="fas fa-bars fa-lg"></i>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
                <div class="offcanvas-header bg-light">
                    <h5 class="offcanvas-title font-heading text-primary">Menu Utama</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body d-flex flex-column flex-lg-row align-items-lg-center w-100">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link" href="buku.html">Buku Paket</a></li>
                        <li class="nav-item"><a class="nav-link" href="posts.html">Ruang Baca</a></li>
                        <li class="nav-item"><a class="nav-link" href="banksoal.html">Bank Soal</a></li>
                    </ul>
                    <div id="authContainer" class="mt-3 mt-lg-0">
                        <button onclick="loginGoogle()" class="btn btn-outline-primary rounded-pill px-4 fw-bold w-100">
                            <i class="fab fa-google me-2"></i> Masuk
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div style="height: 100px;"></div>

    <div class="container pb-5 flex-grow-1">
        <div class="mb-4 text-center">
            <h2 class="font-heading text-primary">Hasil Pencarian</h2>
            <p class="text-muted">Menampilkan materi untuk kata kunci: <span id="searchKeyword" class="fw-bold text-success">...</span></p>
        </div>

        <div class="search-bar-hero d-flex mx-auto mb-5" style="max-width: 600px;">
            <span class="input-group-text bg-transparent border-0 text-muted ps-3"><i class="fas fa-search"></i></span>
            <input type="text" id="mainSearchInput" class="form-control" placeholder="Cari materi lain..." onkeypress="handleEnter(event)">
            <button class="btn btn-primary fw-bold" onclick="doSearch()">Cari Lagi</button>
        </div>

        <div class="row g-4 justify-content-center" id="resultsContainer">
            <!-- Hasil pencarian di-render di sini -->
        </div>
    </div>

    <footer class="main-footer text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 fw-bold text-dark">&copy; KKG PAI SD Kota Banjar Jawa Barat 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
