    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Palet Malam & Galaksi: Ungu Pekat ke Biru Tua */
            background: linear-gradient(135deg, #1E1B4B 0%, #4C1D95 100%);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Top HUD Bar */
        .hud-bar {
            width: 100%;
            height: 85px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3); /* Aksen Emas */
            z-index: 10;
            flex-shrink: 0; 
        }

        .title-area h2 {
            color: #FDE047; /* Emas */
            font-weight: 800;
            margin: 0;
            font-size: 1.5rem;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }
        
        .title-area p {
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            font-size: 0.95rem;
        }

        .stats-area {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-box {
            background: rgba(255, 251, 235, 0.95);
            padding: 5px 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            min-width: 90px;
            border: 2px solid #FDE047;
        }
        
        .stat-box .label { font-size: 0.65rem; font-weight: 800; color: #78350F; text-transform: uppercase; }
        .stat-box .val { font-size: 1.2rem; font-weight: 800; color: #4C1D95; margin: 0; line-height: 1.2; }

        .btn-hud {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #FFFBEB;
            color: #4C1D95;
            border: 2px solid #FDE047;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-hud:active { transform: scale(0.9); }

        /* Area Papan Permainan */
        .board-wrapper {
            flex-grow: 1; 
            min-height: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        .board-container {
            display: grid;
            grid-template-rows: repeat(2, auto);
            justify-content: center;
            align-content: center;
            gap: 15px;
        }

        /* Kartu dengan Rasio yang sedikit berbeda (3:4) */
        .memory-card {
            --gap-space: 15px;
            --total-gap-x: calc((var(--cols) - 1) * var(--gap-space));
            --total-gap-y: var(--gap-space);
            
            --max-h: calc((var(--avail-h) - var(--total-gap-y)) / 2);
            --max-w: calc((var(--avail-w) - var(--total-gap-x)) / var(--cols));
            
            /* Rasio 3:4 agak lebih kotak dibandingkan 2:3 */
            width: min(calc(var(--max-h) * 3 / 4), var(--max-w));
            height: min(var(--max-h), calc(var(--max-w) * 4 / 3));
            
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .is-wrong {
            animation: shake 0.5s ease-in-out;
        }

        .memory-card.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            /* Bentuk Unik ala Ornamen Timur Tengah */
            border-radius: clamp(10px, 3vmin, 30px) clamp(2px, 0.5vmin, 5px) clamp(10px, 3vmin, 30px) clamp(2px, 0.5vmin, 5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8%; 
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        /* Sisi Depan (Menampilkan Teks) */
        .card-front {
            background-color: #FFFBEB; /* Krem Pucat */
            border: clamp(2px, 0.5vw, 5px) dashed #D97706; /* Dashed Emas Kecoklatan */
            transform: rotateY(180deg);
        }
        
        .card-text {
            font-size: clamp(1rem, 3vmin, 2.2rem); 
            font-weight: 800;
            color: #78350F; /* Coklat Tua */
            word-wrap: break-word;
            line-height: 1.2;
        }

        .card-text.arabic {
            font-family: 'Amiri', serif;
            font-size: clamp(1.5rem, 4vmin, 3rem);
            color: #4C1D95; /* Ungu untuk arabnya */
            margin-bottom: 5px;
        }

        .card-type {
            font-size: clamp(0.55rem, 1.5vmin, 1.2rem);
            color: #B45309;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        /* Sisi Belakang (Gambar Assets) */
        .card-back {
            background-color: #312E81; /* Fallback warna ungu tua */
            background-image: url('assets/card_back.png'); /* Menggunakan gambar yang sama */
            background-size: cover;
            background-position: center;
            border: clamp(2px, 0.5vw, 5px) solid #FDE047;
        }

        .is-matched .card-front {
            background-color: #FEF3C7;
            border-color: #10B981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
        }

        /* Responsif Layar Kecil (HP) */
        @media (max-width: 768px) {
            .hud-bar { padding: 15px; flex-direction: column; gap: 12px; height: auto;}
            .title-area { text-align: center; }
            .title-area h2 { font-size: 1.2rem; }
            .title-area p { display: none; }
            .stats-area { flex-wrap: wrap; justify-content: center; }
            .board-wrapper { padding: 10px; height: calc(100dvh - 140px); }
            .btn-hud { width: 40px; height: 40px; font-size: 1rem;}
        }
    </style>
</head>
<body>

        <div class="stats-area">

            <button class="btn-hud text-warning" onclick="resetRound()" title="Ulangi Putaran Ini">

            <button class="btn-hud text-danger" onclick="confirmResetGame()" title="Reset Total (Ke Level 1)">

            <button class="btn-hud text-dark" id="btnFullscreen" title="Layar Penuh">

            </button>
        </div>
    </div>

            { asma: "Al-Muqsit", arti: "Maha Adil" },

            { asma: "Ad-Darr", arti: "Maha Penimpa Kemudharatan" },
            { asma: "An-Nafi'", arti: "Maha Memberi Manfaat" },
            { asma: "An-Nur", arti: "Maha Bercahaya" },
            { asma: "Al-Hadi", arti: "Maha Pemberi Petunjuk" },
            { asma: "Al-Badi'", arti: "Maha Pencipta Tiada Bandingan" },
            { asma: "Al-Baqi", arti: "Maha Kekal" },
            { asma: "Al-Warith", arti: "Maha Pewaris" },
            { asma: "Ar-Rashid", arti: "Maha Pandai" },
            { asma: "As-Sabur", arti: "Maha Sabar" }
        ];

        let currentLevel = 1;
        let currentRound = 1;
        const maxRounds = 5; 

        const savedProgress = localStorage.getItem('memoryGameAsmaulHusnaProgress');
        if (savedProgress) {
            const parsed = JSON.parse(savedProgress);
            currentLevel = parsed.level || 1;
            currentRound = parsed.round || 1;
        }
        
        let pairsCount = 3; 
        let cards = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let moves = 0;
        let matches = 0;

        const boardEl = document.getElementById('gameBoard');
        
        function updateLayout() {
            const wrapper = document.querySelector('.board-wrapper');
            if(!wrapper) return;
            const w = wrapper.clientWidth - 40; 
            const h = wrapper.clientHeight - 40; 
            boardEl.style.setProperty('--avail-w', w + 'px');
            boardEl.style.setProperty('--avail-h', h + 'px');
        }
        window.addEventListener('resize', updateLayout);

        function getPairsCount(level) {
            if (level === 1) return 3; 
            if (level === 2) return 4; 
            if (level === 3) return 5; 
            return 3;
        }

        function saveProgress() {
            localStorage.setItem('memoryGameAsmaulHusnaProgress', JSON.stringify({ level: currentLevel, round: currentRound }));
        }

        function confirmResetGame() {
            Swal.fire({
                title: 'Reset Permainan?',
                text: "Seluruh progres level dan putaran kamu akan dihapus dan diulang dari awal.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: '<i class="fas fa-trash-alt me-1"></i> Ya, Reset!',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentLevel = 1;
                    currentRound = 1;
                    localStorage.removeItem('memoryGameAsmaulHusnaProgress');
                    initGame();
                }
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            pairsCount = getPairsCount(currentLevel);
            
            boardEl.style.setProperty('--cols', pairsCount);
            boardEl.style.gridTemplateColumns = `repeat(${pairsCount}, auto)`;

            boardEl.innerHTML = '';
            cards = [];
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            moves = 0;
            matches = 0;
            updateUI();

            const shuffledDB = shuffleArray([...databaseAsmaulHusna]);
            const selectedPairs = shuffledDB.slice(0, pairsCount);

            selectedPairs.forEach((item, index) => {
                // Kartu Asmaul Husna
                cards.push({ id: index, text: item.asma, type: 'Lafal', classExt: 'arabic' });
                // Kartu Arti
                cards.push({ id: index, text: item.arti, type: 'Artinya', classExt: '' });
            });

            cards = shuffleArray(cards);

            cards.forEach((card) => {
                const cardHtml = `
                    <div class="memory-card" data-id="${card.id}" onclick="flipCard(this)">
                        <div class="card-inner">
                            <div class="card-face card-back"></div>
                            <div class="card-face card-front">
                                <span class="card-type">${card.type}</span>
                                <span class="card-text ${card.classExt}">${card.text}</span>
                            </div>
                        </div>
                    </div>
                `;
                boardEl.insertAdjacentHTML('beforeend', cardHtml);
            });

            setTimeout(updateLayout, 50);
        }

        function resetRound() {
            initGame();
        }

        function flipCard(cardElement) {
            if (lockBoard) return;
            if (cardElement.classList.contains('is-flipped')) return;

            cardElement.classList.add('is-flipped');

            if (!firstCard) {
                firstCard = cardElement;
                return;
            }

            secondCard = cardElement;
            moves++;
            updateUI();

            checkForMatch();
        }

        function checkForMatch() {
            const isMatch = firstCard.dataset.id === secondCard.dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('is-matched');
            secondCard.classList.add('is-matched');
            
            matches++;
            updateUI();
            resetBoard();

            if (matches === pairsCount) {
                setTimeout(() => {
                    let titleText = 'Alhamdulillah!';
                    let msgText = `Ronde ${currentRound} selesai dalam ${moves} percobaan.`;
                    let btnText = 'Lanjut Ronde Berikutnya';
                    let isGameFinished = false;

                    if (currentRound === maxRounds) {
                        if (currentLevel === 3) {
                            titleText = 'Masya Allah! Sempurna!';
                            msgText = 'Kamu telah menyelesaikan SEMUA LEVEL Asmaul Husna! Kamu sungguh cerdas!';
                            btnText = '<i class="fas fa-play me-1"></i> Main Lagi dari Awal';
                            isGameFinished = true;
                        } else {
                            titleText = 'Hebat Sekali!';
                            msgText = `Kamu berhasil menamatkan Level ${currentLevel}! Bersiap untuk level selanjutnya.`;
                            btnText = `Lanjut Level ${currentLevel + 1} <i class="fas fa-arrow-right ms-1"></i>`;
                        }
                    }

                    if (isGameFinished) {
                        Swal.fire({
                            title: titleText,
                            text: msgText,
                            icon: 'success',
                            showCancelButton: true,
                            confirmButtonText: btnText,
                            cancelButtonText: 'Kembali ke Menu',
                            confirmButtonColor: '#7C3AED',
                            cancelButtonColor: '#6c757d',
                            allowOutsideClick: false
                        }).then((result) => {
                            if (result.isConfirmed) {
                                currentRound = 1;
                                currentLevel = 1;
                                localStorage.removeItem('memoryGameAsmaulHusnaProgress');
                                initGame();
                            } else {
                                window.location.href = '../game.html';
                            }
                        });
                    } else {
                        Swal.fire({
                            title: titleText,
                            text: msgText,
                            icon: 'success',
                            confirmButtonText: btnText,
                            confirmButtonColor: '#7C3AED',
                            allowOutsideClick: false
                        }).then((result) => {
                            if (result.isConfirmed) {
                                currentRound++;
                                
                                if (currentRound > maxRounds) {
                                    currentRound = 1;
                                    currentLevel++;
                                }
                                
                                saveProgress();
                                initGame();
                            }
                        });
                    }
                }, 600);
            }
        }

        function unflipCards() {
            lockBoard = true; 
            
            setTimeout(() => {
                firstCard.classList.remove('is-flipped');
                secondCard.classList.remove('is-flipped');

                setTimeout(() => {
                    firstCard.querySelector('.card-inner').classList.add('is-wrong');
                    secondCard.querySelector('.card-inner').classList.add('is-wrong');

                    setTimeout(() => {
                        firstCard.querySelector('.card-inner').classList.remove('is-wrong');
                        secondCard.querySelector('.card-inner').classList.remove('is-wrong');
                        resetBoard();
                    }, 500);

                }, 600); 

            }, 1500); 
        }

        function resetBoard() {
            firstCard = null;
            secondCard = null;
            lockBoard = false;
        }

        function updateUI() {
            document.getElementById('levelDisplay').innerText = currentLevel;
            document.getElementById('roundDisplay').innerText = currentRound;
            document.getElementById('moveCount').innerText = moves;
            document.getElementById('matchCount').innerText = matches;
            document.getElementById('totalMatchCount').innerText = pairsCount;
        }

        const btnFullscreen = document.getElementById('btnFullscreen');
        const iconFullscreen = btnFullscreen.querySelector('i');
        
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Gagal memasuki mode fullscreen: ${err.message}`);
                });
                iconFullscreen.classList.replace('fa-expand', 'fa-compress');
            } else {
                document.exitFullscreen();
                iconFullscreen.classList.replace('fa-compress', 'fa-expand');
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                iconFullscreen.classList.replace('fa-compress', 'fa-expand');
            }
        });

        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
