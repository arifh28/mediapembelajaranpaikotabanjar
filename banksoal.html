    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cardContainer');
            
            // Loop Kelas 1 sampai 6
            for (let kelas = 1; kelas <= 6; kelas++) {
                // Loop Semester 1 sampai 2
                for (let smt = 1; smt <= 2; smt++) {
                    
                    // Nama File JSON target (sesuai format Anda)
                    const fileName = `kelas_${kelas}_semester_${smt}.json`; // misal: kelas_1_semester_1.json
                    const title = `Kelas ${kelas} Semester ${smt}`;
                    const imgColor = smt === 1 ? '4ECDC4' : 'FFE66D'; // Hijau (Ganjil), Kuning (Genap)
                    
                    const html = `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm custom-card border-0">
                            <div class="card-header border-0 text-white py-3 d-flex justify-content-between align-items-center" 
                                 style="background-color: #${imgColor}; border-radius: 20px 20px 0 0;">
                                <h5 class="fw-bold m-0 text-dark opacity-75">${title}</h5>
                                <i class="fas fa-book fa-2x text-dark opacity-25"></i>
                            </div>
                            <div class="card-body">
                                <p class="text-muted small">Bank soal lengkap dengan kisi-kisi, kunci jawaban, dan penilaian otomatis.</p>
                                
                                <div class="d-grid gap-2">
                                    <a href="banksoal/soalguru.html?file=${fileName}" class="btn btn-outline-primary rounded-pill">
                                        <i class="fas fa-chalkboard-teacher me-2"></i> Kartu Soal (Guru)
                                    </a>
                                    
                                    <a href="banksoal/soalsiswa.html?file=${fileName}" class="btn btn-success text-white rounded-pill">
                                        <i class="fas fa-user-graduate me-2"></i> Kerjakan (Siswa)
                                    </a>

                                    <button onclick="copyLink('${fileName}')" class="btn btn-light border text-muted rounded-pill">
                                        <i class="fas fa-copy me-2"></i> Salin Link Siswa
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                    
                    container.innerHTML += html;
                }
            }
        });

        function copyLink(fileName) {
            // Membuat URL absolut untuk halaman siswa
            // Mendeteksi apakah kita ada di folder root atau subfolder
            let basePath = window.location.pathname.replace('banksoal.html', '');
            if (!basePath.endsWith('/')) basePath += '/';
            
            // Perbaiki path agar tidak dobel 'banksoal/banksoal/' jika file ada di subfolder
            // Asumsi: soalsiswa.html ada di folder yang sama dengan banksoal.html
            const url = `${window.location.origin}${basePath}banksoal/soalsiswa.html?file=${fileName}`;
            
            navigator.clipboard.writeText(url).then(() => {
                // Tampilkan SweetAlert dengan Link
                Swal.fire({
                    icon: 'success',
                    title: 'Link Berhasil Disalin!',
                    html: `
                        <p class="mb-2">Link ujian untuk siswa:</p>
                        <div class="p-2 bg-light border rounded text-break small text-muted">
                            ${url}
                        </div>
                    `,
                    timer: 2000, // 2 Detik
                    timerProgressBar: true,
                    showConfirmButton: false
                });
            }).catch(err => {
                Swal.fire('Gagal', 'Tidak bisa menyalin link otomatis.', 'error');
            });
        }
    </script>
