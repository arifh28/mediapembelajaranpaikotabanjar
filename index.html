    <style>
        :root {
            --primary-green: #4ECDC4;
            --secondary-yellow: #FFE66D;
            --dark-text: #292f36;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7fff7;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .maintenance-card {
            max-width: 600px;
            padding: 40px;
            border-radius: 30px;
            background: white;
            box-shadow: 0 15px 40px rgba(78, 205, 196, 0.15);
            text-align: center;
            border-bottom: 8px solid var(--primary-green);
        }

        /* Animasi Ikon Melayang & Berputar */
        .icon-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 230, 109, 0.3); /* Kuning Transparan */
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
        }

        .main-icon {
            color: var(--secondary-yellow);
            font-size: 3.5rem;
            animation: spin-slow 10s linear infinite;
        }

        .gear-small {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--primary-green);
            font-size: 1.5rem;
            animation: spin 4s linear infinite;
        }

        h1 {
            color: var(--dark-text);
            font-weight: 800;
            margin-bottom: 15px;
        }

        p {
            color: #6c757d;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-refresh {
            background-color: var(--primary-green);
            color: white;
            border-radius: 50px;
            padding: 12px 35px;
            font-weight: 700;
            border: none;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-refresh:hover {
            background-color: #3dbbb3;
            transform: scale(1.05);
            color: white;
        }

        /* Keyframes Animasi */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        @keyframes spin-slow {
            100% { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>
