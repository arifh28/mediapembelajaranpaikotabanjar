<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Kelas - Interactive Flat Panel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden; 
            background-color: #4ECDC4;
            margin: 0; padding: 0;
        }

        /* LAYAR START */
        #startScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, #4ECDC4, #556270);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }

        #vanta-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* MENU UTAMA (KELAS 1-6) */
        #mainMenu {
            position: relative; z-index: 2;
            height: 100vh;
            display: none; 
            flex-direction: column;
            justify-content: center; align-items: center;
        }

        .btn-kelas {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%; aspect-ratio: 1/1;
            border-radius: 30px;
            border: 5px solid rgba(255,255,255,0.8);
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .btn-kelas:hover { transform: scale(1.1) !important; filter: brightness(1.1); }
        .angka-besar { font-size: 5rem; line-height: 1; font-weight: 600; }
        .label-kelas { font-size: 1.5rem; letter-spacing: 2px; }

        /* =========================================
           LEVEL 2 & 3: OVERLAYS (APP STYLE)
           ========================================= */
        .app-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            z-index: 3;
            transform: translateY(100%); /* Sembunyi di bawah */
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column;
        }

        .app-overlay.active { transform: translateY(0); /* Muncul */ }

        /* HEADER OVERLAY */
        .overlay-header {
            padding: 20px 40px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* GRID MATERI */
        .materi-grid {
            padding: 40px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card-materi {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .card-materi:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-color: var(--primary-color);
        }

        .icon-type {
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.5rem;
            margin-bottom: 15px;
        }

        /* IFRAME PLAYER */
        .player-container {
            flex-grow: 1;
            width: 100%;
            background: black;
            position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Animations */
        @keyframes wobble { 0% { transform: rotate(0deg); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } 100% { transform: rotate(0deg); } }
        .animate-wobble { animation: wobble 3s ease-in-out infinite; }
    </style>
</head>
<body>

    <div id="startScreen">
        <h1 class="text-white mb-4 display-3 fw-bold">Kelas Digital PAI</h1>
        <button onclick="enterClassroom()" class="btn btn-warning btn-lg rounded-pill px-5 py-3 fw-bold shadow" style="font-size: 1.5rem;">
            <i class="fas fa-play-circle me-2"></i> MULAI BELAJAR
        </button>
    </div>

    <div id="vanta-canvas"></div>

    <div id="mainMenu" class="container-fluid">
        <div class="d-flex justify-content-between w-100 px-5 pt-4 absolute-top">
            <div class="d-flex align-items-center bg-white rounded-pill px-4 py-2 shadow">
                <img src="assets/logo.png" width="50" class="me-3">
                <h4 class="mb-0 fw-bold text-success">PAIBP SD KOTA BANJAR</h4>
            </div>
            <a href="index.html" class="btn btn-danger rounded-circle shadow d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                <i class="fas fa-power-off fa-2x"></i>
            </a>
        </div>

        <div class="row w-100 px-5 justify-content-center g-4 mt-2">
            <div class="col-lg-2"><div onclick="openClass(1)" class="btn-kelas bg-warning text-dark animate-wobble"><span class="angka-besar">1</span><span class="label-kelas">KELAS</span></div></div>
            <div class="col-lg-2"><div onclick="openClass(2)" class="btn-kelas bg-success text-white animate-wobble" style="animation-delay: 0.5s"><span class="angka-besar">2</span><span class="label-kelas">KELAS</span></div></div>
            <div class="col-lg-2"><div onclick="openClass(3)" class="btn-kelas bg-primary text-white animate-wobble" style="animation-delay: 1s"><span class="angka-besar">3</span><span class="label-kelas">KELAS</span></div></div>
            <div class="col-lg-2"><div onclick="openClass(4)" class="btn-kelas bg-danger text-white animate-wobble"><span class="angka-besar">4</span><span class="label-kelas">KELAS</span></div></div>
            <div class="col-lg-2"><div onclick="openClass(5)" class="btn-kelas text-white animate-wobble" style="background:#9b59b6; animation-delay: 0.5s"><span class="angka-besar">5</span><span class="label-kelas">KELAS</span></div></div>
            <div class="col-lg-2"><div onclick="openClass(6)" class="btn-kelas text-white animate-wobble" style="background:#e67e22; animation-delay: 1s"><span class="angka-besar">6</span><span class="label-kelas">KELAS</span></div></div>
        </div>
    </div>

    <div id="overlayMateri" class="app-overlay">
        <div class="overlay-header">
            <h2 class="mb-0 fw-bold text-success" id="kelasTitle"><i class="fas fa-layer-group me-2"></i> Materi Kelas 1</h2>
            <button onclick="closeOverlay('overlayMateri')" class="btn btn-light rounded-circle shadow" style="width:50px; height:50px;">
                <i class="fas fa-times fa-lg text-danger"></i>
            </button>
        </div>
        
        <div class="materi-grid" id="materiListContainer"></div>
    </div>

    <div id="overlayPlayer" class="app-overlay" style="z-index: 4;">
        <div class="overlay-header bg-dark text-white">
            <h4 class="mb-0 text-truncate" id="playerTitle">Judul Materi</h4>
            <button onclick="closeOverlay('overlayPlayer')" class="btn btn-secondary rounded-circle" style="width:50px; height:50px;">
                <i class="fas fa-arrow-left fa-lg"></i>
            </button>
        </div>
        <div class="player-container">
            <iframe id="contentFrame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ==========================================
        // DATABASE MATERI (EDIT LINK DI SINI)
        // ==========================================
        // Tipe: 'ppt' (Powerpoint), 'canva' (Canva), 'genially', 'web' (HTML/Web Lain)
        
        const databaseMateri = {
            "1": [
                { title: "Mengenal Huruf Hijaiyah", type: "ppt", url: "https://view.officeapps.live.com/op/embed.aspx?src=LINK_PPT_ANDA_DISINI.pptx" },
                { title: "Kasih Sayang Allah", type: "canva", url: "https://www.canva.com/design/DAFxxxxx/view?embed" },
                { title: "Bersih Itu Sehat", type: "genially", url: "https://view.genial.ly/xxxxxx" },
                { title: "Kuis Interaktif", type: "web", url: "https://wordwall.net/embed/xxxx" },
                { title: "Rukun Iman", type: "canva", url: "https://www.canva.com/design/DAFxxxxx/view?embed" },
            ],
            "2": [
                { title: "Asmaul Husna", type: "ppt", url: "LINK_PPT" },
                { title: "Perilaku Terpuji", type: "web", url: "https://learningapps.org/watch?v=..." },
            ],
            // ... Tambahkan data untuk kelas 3, 4, 5, 6 ...
        };

        // ==========================================
        // LOGIKA APLIKASI
        // ==========================================

        function enterClassroom() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            
            document.getElementById('startScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('mainMenu').style.display = 'flex';
                
                VANTA.CLOUDS({
                    el: "#vanta-canvas",
                    mouseControls: true, touchControls: true, gyroControls: false,
                    minHeight: 200.00, minWidth: 200.00,
                    skyColor: 0x68b8d7, cloudColor: 0xffffff, cloudShadowColor: 0x3d7e9a,
                    sunColor: 0xffcd38, sunGlareColor: 0xff4d4d, sunlightColor: 0xff9c36,
                    speed: 1.0
                });
            }, 500);
        }

        // BUKA DAFTAR MATERI (LEVEL 2)
        function openClass(kelas) {
            const container = document.getElementById('materiListContainer');
            const title = document.getElementById('kelasTitle');
            const data = databaseMateri[kelas] || []; // Ambil data dari JSON

            // Set Judul
            title.innerHTML = `<span class="badge bg-warning text-dark me-2">KELAS ${kelas}</span> Daftar Materi Pembelajaran`;
            
            // Generate Kartu Materi
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted"><h5>Belum ada materi untuk kelas ini.</h5></div>';
            } else {
                data.forEach(item => {
                    let icon = '';
                    let color = '';
                    
                    // Tentukan Ikon & Warna berdasarkan Tipe
                    if(item.type === 'ppt') { icon = 'fa-file-powerpoint'; color = '#d35400'; } // Orange Powerpoint
                    else if(item.type === 'canva') { icon = 'fa-palette'; color = '#8e44ad'; } // Ungu Canva
                    else if(item.type === 'genially') { icon = 'fa-rocket'; color = '#2980b9'; } // Biru Genially
                    else { icon = 'fa-globe'; color = '#27ae60'; } // Hijau Web

                    const html = `
                    <div class="card-materi p-4 d-flex flex-column align-items-center text-center" onclick="playContent('${item.url}', '${item.title}')">
                        <div class="icon-type shadow" style="background: ${color}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <h5 class="fw-bold mb-2 text-dark">${item.title}</h5>
                        <small class="text-muted text-uppercase fw-bold" style="color: ${color}">${item.type}</small>
                    </div>`;
                    
                    container.innerHTML += html;
                });
            }

            // Tampilkan Overlay dengan Animasi
            document.getElementById('overlayMateri').classList.add('active');
        }

        // BUKA PLAYER (LEVEL 3)
        function playContent(url, title) {
            const frame = document.getElementById('contentFrame');
            const playerTitle = document.getElementById('playerTitle');
            
            // Validasi URL Powerpoint (Harus pakai Embed Viewer Microsoft)
            // Jika user hanya memasukkan link download .pptx, script ini tidak otomatis mengubahnya
            // User harus memasukkan link embed yang benar di JSON.
            
            frame.src = url;
            playerTitle.innerText = title;
            document.getElementById('overlayPlayer').classList.add('active');
        }

        // TUTUP OVERLAY
        function closeOverlay(id) {
            document.getElementById(id).classList.remove('active');
            
            // Jika menutup player, stop video/iframe agar suara tidak bocor
            if(id === 'overlayPlayer') {
                setTimeout(() => { document.getElementById('contentFrame').src = ''; }, 500);
            }
        }
    </script>
</body>
</html>
