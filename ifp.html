<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Kelas - Interactive Flat Panel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden; /* Hilangkan scrollbar */
            background-color: #4ECDC4;
            margin: 0; padding: 0;
        }

        /* LAYAR PEMBUKA (START SCREEN) */
        #startScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, #4ECDC4, #556270);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* BACKGROUND ANIMASI */
        #vanta-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* KONTEN UTAMA */
        #mainContent {
            position: relative; z-index: 2;
            height: 100vh;
            display: none; /* Sembunyi dulu */
            flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* TOMBOL KELAS (WOBBLE ANIMATION) */
        .btn-kelas {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%; aspect-ratio: 1/1;
            border-radius: 30px;
            border: 5px solid rgba(255,255,255,0.8);
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-kelas:hover { transform: scale(1.1) !important; filter: brightness(1.1); }
        
        .angka-besar { font-size: 5rem; line-height: 1; font-weight: 600; }
        .label-kelas { font-size: 1.5rem; letter-spacing: 2px; }

        /* KEYFRAMES WOBBLE */
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
            75% { transform: rotate(-1deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-wobble { animation: wobble 3s ease-in-out infinite; }
        .delay-1 { animation-delay: 1s; }
        .delay-2 { animation-delay: 2s; }

        /* TRENDING CARD */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div id="startScreen">
        <h1 class="text-white mb-4" style="font-size: 3rem;">Selamat Datang di Kelas Digital</h1>
        <button onclick="enterClassroom()" class="btn btn-warning btn-lg rounded-pill px-5 py-3 fw-bold shadow pulse-btn" style="font-size: 1.5rem;">
            <i class="fas fa-play-circle me-2"></i> MULAI PEMBELAJARAN
        </button>
        <p class="text-white mt-3 opacity-75">Klik tombol di atas untuk masuk mode layar penuh</p>
    </div>

    <div id="vanta-canvas"></div>

    <div id="mainContent" class="container-fluid">
        
        <div class="d-flex justify-content-between w-100 px-5 pt-4 absolute-top">
            <div class="d-flex align-items-center bg-white rounded-pill px-4 py-2 shadow">
                <img src="assets/logo.png" width="50" class="me-3">
                <h4 class="mb-0 fw-bold text-success">PAIBP SD KOTA BANJAR</h4>
            </div>
            <a href="index.html" class="btn btn-danger rounded-circle shadow d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                <i class="fas fa-power-off fa-2x"></i>
            </a>
        </div>

        <div class="row w-100 px-5 justify-content-center g-4 mt-2">
            <div class="col-lg-2">
                <a href="kelas1.html" class="btn-kelas bg-warning text-dark animate-wobble">
                    <span class="angka-besar">1</span>
                    <span class="label-kelas">KELAS</span>
                </a>
            </div>
            <div class="col-lg-2">
                <a href="kelas2.html" class="btn-kelas bg-success text-white animate-wobble delay-1">
                    <span class="angka-besar">2</span>
                    <span class="label-kelas">KELAS</span>
                </a>
            </div>
            <div class="col-lg-2">
                <a href="kelas3.html" class="btn-kelas bg-primary text-white animate-wobble delay-2">
                    <span class="angka-besar">3</span>
                    <span class="label-kelas">KELAS</span>
                </a>
            </div>
            <div class="col-lg-2">
                <a href="kelas4.html" class="btn-kelas bg-danger text-white animate-wobble">
                    <span class="angka-besar">4</span>
                    <span class="label-kelas">KELAS</span>
                </a>
            </div>
            <div class="col-lg-2">
                <a href="kelas5.html" class="btn-kelas text-white animate-wobble delay-1" style="background-color: #9b59b6;">
                    <span class="angka-besar">5</span>
                    <span class="label-kelas">KELAS</span>
                </a>
            </div>
            <div class="col-lg-2">
                <a href="kelas6.html" class="btn-kelas text-white animate-wobble delay-2" style="background-color: #e67e22;">
                    <span class="angka-besar">6</span>
                    <span class="label-kelas">KELAS</span>
                </a>
            </div>
        </div>

        <div class="row w-100 px-5 justify-content-center mt-5">
            <div class="col-10">
                <div class="glass-panel p-4 shadow-lg">
                    <h4 class="fw-bold text-dark mb-3"><i class="fas fa-fire text-danger me-2"></i> Sedang Banyak Dipelajari</h4>
                    <div id="trendingContainer" class="row g-3">
                        <div class="col-12 text-center text-muted">Memuat data trending...</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // CONFIG SUPABASE
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // FUNGSI MULAI (Enter Fullscreen & Init Vanta)
        function enterClassroom() {
            // 1. Masuk Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }

            // 2. Transisi UI
            document.getElementById('startScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                
                // 3. Nyalakan Vanta JS (Clouds)
                VANTA.CLOUDS({
                    el: "#vanta-canvas",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    skyColor: 0x68b8d7,
                    cloudColor: 0xffffff,
                    cloudShadowColor: 0x3d7e9a,
                    sunColor: 0xffcd38,
                    sunGlareColor: 0xff4d4d,
                    sunlightColor: 0xff9c36,
                    speed: 1.2 // Sedikit lebih cepat agar dinamis
                });
            }, 500);

            // 4. Load Data
            loadTrending();
        }

        // FUNGSI LOAD TRENDING
        async function loadTrending() {
            const container = document.getElementById('trendingContainer');
            
            const { data, error } = await _supabase
                .from('material_analytics')
                .select('material_name, click_count')
                .order('click_count', { ascending: false })
                .limit(4);

            if (data && data.length > 0) {
                container.innerHTML = '';
                data.forEach((item, index) => {
                    let judul = item.material_name.replace(/_/g, ' ').toUpperCase(); 
                    // Asumsi format link: kelasX.html?highlight=...
                    // Kita ambil angka pertama setelah 'k' -> k4_materi...
                    let kelas = item.material_name.charAt(1); 
                    let link = `kelas${kelas}.html?highlight=${item.material_name}`;

                    let html = `
                    <div class="col-md-3">
                        <a href="${link}" class="text-decoration-none">
                            <div class="card h-100 border-0 shadow-sm" style="transition:0.3s" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                                <div class="card-body p-2 d-flex align-items-center">
                                    <h1 class="fw-bold text-secondary me-3 mb-0">#${index+1}</h1>
                                    <div class="text-truncate">
                                        <h6 class="fw-bold text-dark mb-0 text-truncate">${judul}</h6>
                                        <small class="text-muted">${item.click_count}x Dilihat</small>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>`;
                    container.innerHTML += html;
                });
            } else {
                container.innerHTML = '<div class="col-12 text-center">Belum ada data trending.</div>';
            }
        }
    </script>
</body>
</html>
