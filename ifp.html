        body {

        /* LAYAR START */
        #startScreen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(135deg, #4ECDC4, #556270);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }

        #vanta-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* MENU UTAMA (KELAS 1-6) */
        #mainMenu {
            position: relative; z-index: 2;
            height: 100vh;
            display: none; 
            flex-direction: column;
            justify-content: center; align-items: center;
        }

        .btn-kelas {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            width: 100%; aspect-ratio: 1/1;
            border-radius: 30px;
            border: 5px solid rgba(255,255,255,0.8);
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .btn-kelas:hover { transform: scale(1.1) !important; filter: brightness(1.1); }
        .angka-besar { font-size: 5rem; line-height: 1; font-weight: 600; }
        .label-kelas { font-size: 1.5rem; letter-spacing: 2px; }

        /* =========================================
           LEVEL 2 & 3: OVERLAYS (APP STYLE)
           ========================================= */
        .app-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            z-index: 3;
            transform: translateY(100%); /* Sembunyi di bawah */
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column;
        }

        .app-overlay.active { transform: translateY(0); /* Muncul */ }

        /* HEADER OVERLAY */
        .overlay-header {
            padding: 20px 40px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* GRID MATERI */
        .materi-grid {
            padding: 40px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .card-materi {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .card-materi:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-color: var(--primary-color);
        }

        .icon-type {
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.5rem;
            margin-bottom: 15px;
        }

        /* IFRAME PLAYER */
        .player-container {
            flex-grow: 1;
            width: 100%;
            background: black;
            position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Animations */
        @keyframes wobble { 0% { transform: rotate(0deg); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } 100% { transform: rotate(0deg); } }
        .animate-wobble { animation: wobble 3s ease-in-out infinite; }

        // ==========================================
        // 4. LOGIKA APLIKASI (UTAMA)
        // ==========================================

        // FUNGSI 1: Masuk dari Halaman Judul
        function enterClassroom() {
            // Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(err => console.log(err));
            
            // Animasi Transisi
            document.getElementById('startScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('mainMenu').style.display = 'flex';
                
                // Efek Awan (Vanta JS) - Pastikan script vanta diload di <head>
                if(window.VANTA) {
                    VANTA.CLOUDS({
                        el: "#vanta-canvas",
                        mouseControls: true, touchControls: true, gyroControls: false,
                        minHeight: 200.00, minWidth: 200.00,
                        skyColor: 0x68b8d7, cloudColor: 0xffffff, cloudShadowColor: 0x3d7e9a,
                        sunColor: 0xffcd38, sunGlareColor: 0xff4d4d, sunlightColor: 0xff9c36,
                        speed: 1.0
                    });
                }
            }, 500);

            // Tracking Page View
            trackEvent('page_view', 'ifp.html');
        }

        // FUNGSI 2: Buka Daftar Materi (Klik Tombol Kelas)
        function openClass(kelas) {
            console.log("Membuka Kelas: " + kelas); 
            activeKelas = kelas; 

            const container = document.getElementById('materiListContainer');
            const title = document.getElementById('kelasTitle');
            const data = databaseMateri[kelas] || []; 

            // Update Judul
            title.innerHTML = `<span class="badge bg-warning text-dark me-2">KELAS ${kelas}</span> Daftar Materi Pembelajaran`;
            
            // Kosongkan Container
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h3>📭</h3><h5>Belum ada materi untuk kelas ini.</h5></div>';
            } else {
                data.forEach(item => {
                    // Default Values
                    let icon = 'fa-globe';
                    let color = '#27ae60';
                    let iconBase = 'fas'; // Default pakai FAS (Solid)

                    // === LOGIKA DETEKSI IKON & TIPE ===
                    if(item.type === 'ppt') { 
                        icon = 'fa-file-powerpoint'; 
                        color = '#d35400'; 
                    } 
                    else if(item.type === 'canva') { 
                        icon = 'fa-palette'; 
                        color = '#8e44ad'; 
                    } 
                    else if(item.type === 'genially') { 
                        icon = 'fa-rocket'; 
                        color = '#2980b9'; 
                    } 
                    else if(item.type === 'youtube') { 
                        icon = 'fa-youtube'; 
                        color = '#FF0000'; 
                        iconBase = 'fab'; // <--- KHUSUS YOUTUBE PAKAI FAB (BRAND)
                    }
                    else if(item.type === 'ebook') { 
                        icon = 'fa-book-open'; 
                        color = '#17a2b8'; 
                    }
                    else if(item.type === 'pdf') { 
                        icon = 'fa-file-pdf'; 
                        color = '#e74c3c'; 
                    }

                    // === RENDER HTML (DENGAN PERBAIKAN CSS) ===
                    // Perhatikan style: min-width & min-height agar tidak lonjong
                    const html = `
                    <div class="card-materi p-4 d-flex flex-column align-items-center text-center animate-up" 
                         onclick="playContent('${item.url}', '${item.title}')"
                         style="cursor: pointer; transition: transform 0.2s;">
                        
                        <div class="icon-circle shadow mb-3" 
                             style="background: ${color}; 
                                    width: 70px; height: 70px; 
                                    min-width: 70px; min-height: 70px; 
                                    border-radius: 50%; 
                                    display: flex; align-items: center; justify-content: center; 
                                    color: white; font-size: 2rem;
                                    flex-shrink: 0;">
                            <i class="${iconBase} ${icon}"></i>
                        </div>

                        <h5 class="fw-bold mb-1 w-100" style="font-size: 1.1rem; color: #000 !important; line-height: 1.3;">
                            ${item.title}
                        </h5>

                        <small class="text-white px-2 py-1 rounded-pill mt-2 fw-bold" style="background-color: ${color}; font-size: 0.7rem; letter-spacing: 1px;">
                            ${item.type.toUpperCase()}
                        </small>
                    </div>`;
                    
                    container.innerHTML += html;
                });
            }

            const overlay = document.getElementById('overlayMateri');
            if(overlay) overlay.classList.add('active');
        }

        // FUNGSI 3: Putar Konten (Klik Materi)
        function playContent(url, title) {
            const frame = document.getElementById('contentFrame');
            const playerTitle = document.getElementById('playerTitle');
            
            frame.src = url;
            playerTitle.innerText = title;
            document.getElementById('overlayPlayer').classList.add('active');

            // Tracking Klik Materi
            const trackingName = `ifp_${activeKelas}_${title}`;
            trackEvent('click_material', trackingName);
        }

        // FUNGSI 4: Tutup Overlay
        function closeOverlay(id) {
            document.getElementById(id).classList.remove('active');
            
            // Stop Video/Audio saat ditutup
            if(id === 'overlayPlayer') {
                setTimeout(() => { document.getElementById('contentFrame').src = ''; }, 500);
            }
        }
    </script>
