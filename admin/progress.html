<!DOCTYPE html>
<html>
<head>
    <title>Progress Guru</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Verdana, Arial, sans-serif; background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; font-size: 12px; }
        #header { background-color: #3B5998; color: #FFFFFF; padding: 10px 15px; font-size: 18px; font-weight: bold; }
        #nav { background-color: #CCCCCC; border-bottom: 1px solid #000000; padding: 5px 15px; }
        #nav a { color: #000000; text-decoration: none; margin-right: 15px; font-weight: bold; }
        #nav a:hover { text-decoration: underline; color: #0000EE; }
        .container { width: 900px; margin: 20px auto; }
        h2 { color: #3B5998; border-bottom: 2px solid #3B5998; margin-top: 0; padding-bottom: 5px; }
        .filter-box { background-color: #F8F8F8; border: 1px solid #000000; padding: 15px; margin-bottom: 20px; font-weight: bold; }
        select { font-family: Verdana, sans-serif; font-size: 12px; border: 1px solid #000; padding: 2px; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: #D3D3D3; border: 1px solid #000000; padding: 5px; text-align: left; }
        td { border: 1px solid #000000; padding: 5px; }
        .sudah { color: #0000FF; font-weight: bold; }
        .belum { color: #FF0000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">Admin Panel - PAIBP SD</div>
    <div id="nav">
        <a href="index.html">[Home]</a>
        <a href="admin.html">[Admin]</a>
        <a href="analitik.html">[Analitik]</a>
        <a href="dashboard.html">[Dashboard]</a>
        <a href="progress.html">[Progress]</a>
        <a href="saran.html">[Saran]</a>
    </div>

    <div class="container">
        <h2>Laporan Progress Pengerjaan</h2>
        
        <div class="filter-box">
            Filter Data: 
            <select id="filterStatus" onchange="applyFilter()">
                <option value="all">Semua Status</option>
                <option value="Sudah">Sudah Mengerjakan</option>
                <option value="Belum">Belum Mengerjakan</option>
            </select>
        </div>

        <table id="progressTable">
            <thead>
                <tr>
                    <th width="5%">No</th>
                    <th width="30%">Nama Guru</th>
                    <th width="15%">Kode Kec</th>
                    <th width="35%">Materi</th>
                    <th width="15%">Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="color:red; text-align:center;">Loading Data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let globalData = [];

        async function fetchData() {
            const { data, error } = await _supabase.from('material_analytics').select('*').order('id', { ascending: true });
            if (error) { alert("Error: " + error.message); return; }
            globalData = data;
            applyFilter();
        }

        function applyFilter() {
            const fVal = document.getElementById('filterStatus').value;
            let filtered = fVal === 'all' ? globalData : globalData.filter(i => i.sudah === fVal);
            
            let html = '';
            filtered.forEach((row, idx) => {
                const cColor = row.sudah === 'Sudah' ? 'sudah' : 'belum';
                const materi = (row.material_name || '').replace(/_/g, ' ').toUpperCase();
                html += `<tr>
                    <td>${idx + 1}</td>
                    <td><b>${row.guru || '-'}</b></td>
                    <td>Kec-${row.kecamatan || '0'}</td>
                    <td>${materi}</td>
                    <td class="${cColor}">${row.sudah || 'Belum'}</td>
                </tr>`;
            });
            document.getElementById('tableBody').innerHTML = html;
        }

        window.onload = fetchData;
    </script>
</body>
</html>
