<!DOCTYPE html>
<html>
<head>
    <title>Analitik Pengunjung</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Verdana, Arial, sans-serif; background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; font-size: 12px; }
        #header { background-color: #3B5998; color: #FFFFFF; padding: 10px 15px; font-size: 18px; font-weight: bold; }
        #nav { background-color: #CCCCCC; border-bottom: 1px solid #000000; padding: 5px 15px; }
        #nav a { color: #000000; text-decoration: none; margin-right: 15px; font-weight: bold; }
        #nav a:hover { text-decoration: underline; color: #0000EE; }
        .container { width: 900px; margin: 20px auto; }
        h2 { color: #3B5998; border-bottom: 2px solid #3B5998; margin-top: 0; padding-bottom: 5px; }
        .stat-container { text-align: center; margin-bottom: 20px; }
        .stat-box { display: inline-block; width: 20%; background-color: #F0F0F0; border: 1px solid #000000; margin: 5px; padding: 10px; }
        .stat-box h3 { margin: 0 0 5px 0; font-size: 12px; color: #333333; }
        .stat-box .val { font-size: 20px; font-weight: bold; color: #0000EE; margin: 0; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: #D3D3D3; border: 1px solid #000000; padding: 5px; text-align: left; }
        td { border: 1px solid #000000; padding: 5px; }
    </style>
</head>
<body>
    <div id="header">Admin Panel - PAIBP SD</div>
    <div id="nav">
        <a href="index.html">[Home]</a>
        <a href="admin.html">[Admin]</a>
        <a href="analitik.html">[Analitik]</a>
        <a href="dashboard.html">[Dashboard]</a>
        <a href="progress.html">[Progress]</a>
        <a href="saran.html">[Saran]</a>
    </div>

    <div class="container">
        <h2>Ringkasan Trafik (Page Views)</h2>
        
        <div class="stat-container">
            <div class="stat-box"><h3>HARI INI</h3><p class="val" id="viewToday">0</p></div>
            <div class="stat-box"><h3>MINGGU INI</h3><p class="val" id="viewWeek">0</p></div>
            <div class="stat-box"><h3>BULAN INI</h3><p class="val" id="viewMonth">0</p></div>
            <div class="stat-box"><h3>TOTAL</h3><p class="val" id="viewAll">0</p></div>
        </div>

        <h2>Log Aktivitas</h2>
        <table>
            <thead>
                <tr>
                    <th width="5%">No</th>
                    <th width="20%">Waktu</th>
                    <th width="20%">Tipe</th>
                    <th>Detail Aktivitas</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <tr><td colspan="4" style="text-align:center; color:red;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchAnalytics() {
            const { data, error } = await _supabase.from('analytics_logs').select('*').order('created_at', { ascending: false }).limit(500);
            if (error) { alert("Error: " + error.message); return; }

            const now = new Date();
            const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            let views = { today: 0, week: 0, month: 0, all: 0 };

            let html = '';
            data.forEach((row, index) => {
                const rowDate = new Date(row.created_at);
                if (row.event_type === 'page_view') {
                    views.all++;
                    if (rowDate >= startMonth) views.month++;
                    if (rowDate >= startToday) views.today++;
                }

                html += `<tr>
                    <td>${index + 1}</td>
                    <td>${rowDate.toLocaleString('id-ID')}</td>
                    <td>${row.event_type}</td>
                    <td>${row.event_name}</td>
                </tr>`;
            });

            document.getElementById('viewToday').innerText = views.today;
            document.getElementById('viewMonth').innerText = views.month;
            document.getElementById('viewAll').innerText = views.all;
            document.getElementById('logBody').innerHTML = html;
        }

        window.onload = fetchAnalytics;
    </script>
</body>
</html>
