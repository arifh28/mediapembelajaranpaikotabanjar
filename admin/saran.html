<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kelola Saran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script.js"></script>
</head>
<body class="bg-dark text-light">
    
    <div class="container py-5">
        <h2 class="fw-bold mb-4 text-warning"><i class="fas fa-cogs me-2"></i>Admin Dashboard: Kritik & Saran</h2>

        <div class="card bg-secondary border-0 shadow-lg text-light">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="p-3">Waktu</th>
                                <th>Pengirim (IP)</th>
                                <th>Kritik / Saran</th>
                                <th class="p-3 text-center">Balasan Anda</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <tr><td colspan="4" class="text-center p-4">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('adminTableBody');
            
            async function loadAdminData() {
                try {
                    const { data, error } = await _supabase
                        .from('kritik_saran')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    tbody.innerHTML = '';

                    data.forEach(item => {
                        const tgl = new Date(item.created_at).toLocaleString('id-ID');
                        const jawaban = item.jawaban_admin || '';

                        tbody.innerHTML += `
                            <tr>
                                <td class="p-3"><small class="text-white-50">${tgl}</small></td>
                                <td>
                                    <div class="fw-bold text-warning">${item.nama}</div>
                                    <small class="badge bg-dark border border-secondary">${item.ip_address}</small>
                                </td>
                                <td>${item.saran}</td>
                                <td class="p-3" style="min-width: 300px;">
                                    <div class="input-group">
                                        <textarea class="form-control bg-dark text-light border-secondary" id="reply-${item.id}" rows="2" placeholder="Tulis balasan...">${jawaban}</textarea>
                                        <button class="btn btn-success" onclick="simpanBalasan(${item.id})">Simpan</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                } catch (err) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error: ${err.message}</td></tr>`;
                }
            }

            // Fungsi global untuk update jawaban ke Supabase
            window.simpanBalasan = async function(id) {
                const jawabanBaru = document.getElementById(`reply-${id}`).value;
                try {
                    const { error } = await _supabase
                        .from('kritik_saran')
                        .update({ jawaban_admin: jawabanBaru })
                        .eq('id', id);

                    if (error) throw error;
                    alert("Balasan berhasil disimpan! Akan tayang di halaman publik.");
                } catch (err) {
                    alert("Gagal menyimpan: " + err.message);
                }
            };

            loadAdminData();
        });
    </script>
</body>
</html>
