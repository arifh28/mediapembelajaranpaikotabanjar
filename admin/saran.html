<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kritik & Saran - Admin PAIBP</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    
    <link rel="stylesheet" href="../style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="../script.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        
        /* SIDEBAR STYLE (Sama dengan Analitik) */
        .sidebar {
            width: 260px;
            background-color: #212529;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .nav-link { transition: all 0.3s ease; }
        .hover-bg:hover { background-color: rgba(255,255,255,0.1); }
        .main-content { margin-left: 260px; min-height: 100vh; }
        
        .bg-gradient-success {
            background: linear-gradient(135deg, #198754 0%, #20c997 100%);
        }
        
        /* Penyesuaian Textarea DataTable */
        .reply-box { min-width: 250px; }
        textarea:disabled { background-color: #e9ecef; cursor: not-allowed; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: absolute; z-index: 1000; }
            .sidebar.show { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body class="d-flex">

    <nav class="sidebar p-3 vh-100 position-fixed text-white d-flex flex-column">
        <div class="text-center mb-4 mt-2">
            <h4 class="fw-bold text-success mb-0"><i class="fas fa-shield-alt me-2"></i>Admin Panel</h4>
            <small class="text-white-50">PAIBP SD Kota Banjar</small>
        </div>
        <hr class="border-secondary mb-4">
        
        <ul class="nav flex-column mb-auto">
            <li class="nav-item mb-2">
                <a href="analitik.html" class="nav-link text-white rounded hover-bg">
                    <i class="fas fa-chart-line me-3"></i> Analitik Pengunjung
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="saran.html" class="nav-link text-white bg-success rounded shadow-sm">
                    <i class="fas fa-comments me-3"></i> Kritik & Saran
                </a>
            </li>
        </ul>

        <hr class="border-secondary mt-4 mb-3">
        <a href="../index.html" class="nav-link text-danger rounded hover-bg fw-bold">
            <i class="fas fa-sign-out-alt me-3"></i> Keluar
        </a>
    </nav>

    <div class="main-content flex-grow-1 w-100">
        
        <div class="bg-gradient-success text-white p-4 shadow-sm mb-4">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">Pusat Kritik & Saran</h2>
                    <p class="mb-0 opacity-75">Kelola masukan pengguna dan berikan tanggapan.</p>
                </div>
                <div class="d-none d-md-block">
                    <i class="fas fa-comment-dots fa-3x opacity-50"></i>
                </div>
            </div>
        </div>

        <div class="container-fluid px-4 pb-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <div class="table-responsive">
                        <table id="saranTable" class="table table-hover align-middle w-100">
                            <thead class="table-light text-secondary">
                                </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

    <script>
        let dataTableInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadSaranData();
        });

        // ==========================================
        // 1. FUNGSI LOAD DATA DARI SUPABASE
        // ==========================================
        async function loadSaranData() {
            try {
                // Tampilkan loading dengan SweetAlert
                Swal.fire({
                    title: 'Memuat Data...',
                    text: 'Mengambil kritik & saran dari server',
                    allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading() }
                });

                const { data, error } = await _supabase
                    .from('kritik_saran')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Format data untuk DataTables
                const formattedData = data.map((item, index) => {
                    // Format Tanggal
                    const dateObj = new Date(item.created_at);
                    const waktu = `${dateObj.toLocaleDateString('id-ID')} <br><small class="text-muted">${dateObj.toLocaleTimeString('id-ID')}</small>`;
                    
                    // Identitas Pengirim
                    const pengirim = `
                        <div class="fw-bold text-dark">${item.nama}</div>
                        <span class="badge bg-light text-secondary border mt-1"><i class="fas fa-network-wired me-1"></i>${item.ip_address || 'IP Tidak Terdeteksi'}</span>
                    `;

                    // Status dan Form Jawaban
                    const jawaban = item.jawaban_admin || '';
                    const hasAnswer = jawaban.trim() !== '';
                    const textAreaDisabled = hasAnswer ? 'disabled' : '';
                    
                    // Logika Tombol Edit & Simpan
                    let actionButtons = '';
                    if (hasAnswer) {
                        actionButtons = `
                            <button id="btn-edit-${item.id}" class="btn btn-sm btn-outline-warning shadow-sm" onclick="editBalasan(${item.id})">
                                <i class="fas fa-edit me-1"></i> Edit
                            </button>
                            <button id="btn-save-${item.id}" class="btn btn-sm btn-success shadow-sm d-none" onclick="simpanBalasan(${item.id})">
                                <i class="fas fa-save me-1"></i> Update
                            </button>
                        `;
                    } else {
                        actionButtons = `
                            <button id="btn-edit-${item.id}" class="btn btn-sm btn-outline-warning shadow-sm d-none" onclick="editBalasan(${item.id})">
                                <i class="fas fa-edit me-1"></i> Edit
                            </button>
                            <button id="btn-save-${item.id}" class="btn btn-sm btn-primary shadow-sm" onclick="simpanBalasan(${item.id})">
                                <i class="fas fa-paper-plane me-1"></i> Kirim
                            </button>
                        `;
                    }

                    const formBalasan = `
                        <div class="reply-box">
                            <textarea class="form-control mb-2" id="reply-${item.id}" rows="3" placeholder="Tulis jawaban admin di sini..." ${textAreaDisabled}>${jawaban}</textarea>
                            <div class="d-flex justify-content-end gap-2">
                                ${actionButtons}
                            </div>
                        </div>
                    `;

                    return [
                        index + 1,
                        waktu,
                        pengirim,
                        `<p class="text-wrap mb-0" style="min-width: 200px;">"${item.saran}"</p>`,
                        formBalasan
                    ];
                });

                Swal.close();

                // Hancurkan instance lama jika ada (agar tidak bentrok saat reload)
                if (dataTableInstance) { dataTableInstance.destroy(); }

                // Inisialisasi DataTables
                dataTableInstance = $('#saranTable').DataTable({
                    data: formattedData,
                    columns: [
                        { title: "No", className: "text-center fw-bold align-top", width: "5%" },
                        { title: "Waktu", className: "align-top", width: "15%" },
                        { title: "Pengirim", className: "align-top", width: "20%" },
                        { title: "Kritik / Saran", className: "align-top", width: "30%" },
                        { title: "Tanggapan Admin", className: "align-top", width: "30%" }
                    ],
                    language: {
                        search: "Cari Data:",
                        lengthMenu: "Tampil _MENU_",
                        info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ saran",
                        paginate: { first: "Awal", last: "Akhir", next: ">", previous: "<" },
                        zeroRecords: "Belum ada kritik & saran yang masuk"
                    },
                    order: [[ 0, 'asc' ]], // Urut berdasarkan No
                    pageLength: 10
                });

            } catch (err) {
                console.error(err);
                Swal.fire('Error!', 'Gagal memuat data saran: ' + err.message, 'error');
            }
        }

        // ==========================================
        // 2. FUNGSI MENGAKTIFKAN TEXTAREA (EDIT)
        // ==========================================
        window.editBalasan = function(id) {
            // Aktifkan textarea
            const textArea = document.getElementById(`reply-${id}`);
            textArea.disabled = false;
            textArea.focus(); // Fokuskan kursor ke dalam textarea otomatis

            // Sembunyikan tombol Edit, Tampilkan tombol Simpan(Update)
            document.getElementById(`btn-edit-${id}`).classList.add('d-none');
            document.getElementById(`btn-save-${id}`).classList.remove('d-none');
        };

        // ==========================================
        // 3. FUNGSI SIMPAN/UPDATE BALASAN
        // ==========================================
        window.simpanBalasan = async function(id) {
            const jawabanBaru = document.getElementById(`reply-${id}`).value;
            const btnSave = document.getElementById(`btn-save-${id}`);
            const btnEdit = document.getElementById(`btn-edit-${id}`);
            const textArea = document.getElementById(`reply-${id}`);

            // Validasi kosong
            if (jawabanBaru.trim() === '') {
                Swal.fire('Peringatan', 'Jawaban tidak boleh kosong!', 'warning');
                return;
            }

            // Animasi Loading di tombol
            const originalText = btnSave.innerHTML;
            btnSave.disabled = true;
            btnSave.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Menyimpan...';

            try {
                // Update ke Supabase
                const { error } = await _supabase
                    .from('kritik_saran')
                    .update({ jawaban_admin: jawabanBaru })
                    .eq('id', id);

                if (error) throw error;

                // Notifikasi Sukses
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: 'Tanggapan telah disimpan dan tampil di halaman publik.',
                    timer: 2000,
                    showConfirmButton: false
                });

                // Kunci kembali Textarea
                textArea.disabled = true;

                // Kembalikan status tombol (Tampilkan Edit, Sembunyikan Simpan)
                btnSave.disabled = false;
                btnSave.innerHTML = originalText;
                btnSave.classList.add('d-none');
                
                // Ubah style tombol Edit menjadi Success/Warning sesuai selera (biarkan tetap warning)
                btnEdit.classList.remove('d-none');

            } catch (err) {
                Swal.fire('Error!', 'Gagal menyimpan tanggapan: ' + err.message, 'error');
                btnSave.disabled = false;
                btnSave.innerHTML = originalText;
            }
        };
    </script>
</body>
</html>
