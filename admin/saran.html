<!DOCTYPE html>
<html>
<head>
    <title>Kotak Kritik & Saran</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Verdana, Arial, sans-serif; background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; font-size: 12px; }
        #header { background-color: #3B5998; color: #FFFFFF; padding: 10px 15px; font-size: 18px; font-weight: bold; }
        #nav { background-color: #CCCCCC; border-bottom: 1px solid #000000; padding: 5px 15px; }
        #nav a { color: #000000; text-decoration: none; margin-right: 15px; font-weight: bold; }
        #nav a:hover { text-decoration: underline; color: #0000EE; }
        .container { width: 900px; margin: 20px auto; }
        h2 { color: #3B5998; border-bottom: 2px solid #3B5998; margin-top: 0; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #D3D3D3; border: 1px solid #000000; padding: 5px; text-align: left; }
        td { border: 1px solid #000000; padding: 5px; vertical-align: top; }
        textarea { width: 95%; font-family: Verdana, sans-serif; font-size: 11px; border: 1px solid #000000; padding: 3px; display: block; margin-bottom: 5px; }
        textarea:disabled { background-color: #E0E0E0; color: #666666; }
        button { font-family: Verdana, sans-serif; font-size: 11px; background-color: #E0E0E0; border: 2px outset #FFFFFF; padding: 2px 8px; cursor: pointer; }
        button:active { border-style: inset; }
    </style>
</head>
<body>
    <div id="header">Admin Panel - PAIBP SD</div>
    <div id="nav">
        <a href="index.html">[Home]</a>
        <a href="admin.html">[Admin]</a>
        <a href="analitik.html">[Analitik]</a>
        <a href="dashboard.html">[Dashboard]</a>
        <a href="progress.html">[Progress]</a>
        <a href="saran.html">[Saran]</a>
    </div>

    <div class="container">
        <h2>Pusat Kritik & Saran</h2>
        <table>
            <thead>
                <tr>
                    <th width="20%">Pengirim & IP</th>
                    <th width="40%">Isi Pesan</th>
                    <th width="40%">Balasan Admin</th>
                </tr>
            </thead>
            <tbody id="saranBody">
                <tr><td colspan="3" style="color:red; text-align:center;">Loading database...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadSaran() {
            const { data, error } = await _supabase.from('kritik_saran').select('*').order('created_at', { ascending: false });
            if (error) { alert("Error: " + error.message); return; }

            let html = '';
            data.forEach((item) => {
                const isAnswered = item.jawaban_admin && item.jawaban_admin.trim() !== '';
                const disabledProp = isAnswered ? 'disabled' : '';
                const buttonText = isAnswered ? 'Edit Balasan' : 'Kirim Balasan';
                
                html += `<tr>
                    <td><b>${item.nama}</b><br><span style="color:#666;">IP: ${item.ip_address || '?'}</span></td>
                    <td style="font-style:italic;">"${item.saran}"</td>
                    <td>
                        <textarea id="reply-${item.id}" rows="3" ${disabledProp}>${item.jawaban_admin || ''}</textarea>
                        <button id="btn-${item.id}" onclick="handleReply(${item.id})">${buttonText}</button>
                    </td>
                </tr>`;
            });
            document.getElementById('saranBody').innerHTML = html;
        }

        async function handleReply(id) {
            const textArea = document.getElementById(`reply-${id}`);
            const btn = document.getElementById(`btn-${id}`);

            if (textArea.disabled) {
                textArea.disabled = false;
                btn.innerText = 'Simpan Balasan';
                textArea.focus();
            } else {
                const val = textArea.value.trim();
                if (val === '') { alert("Balasan tidak boleh kosong."); return; }

                btn.innerText = 'Menyimpan...';
                const { error } = await _supabase.from('kritik_saran').update({ jawaban_admin: val }).eq('id', id);
                
                if (error) {
                    alert("Gagal menyimpan: " + error.message);
                    btn.innerText = 'Coba Lagi';
                } else {
                    alert("Sukses! Balasan disimpan.");
                    textArea.disabled = true;
                    btn.innerText = 'Edit Balasan';
                }
            }
        }

        window.onload = loadSaran;
    </script>
</body>
</html>
