<!DOCTYPE html>
<html>
<head>
    <title>Admin Data Guru</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Verdana, Arial, sans-serif; background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; font-size: 12px; }
        #header { background-color: #3B5998; color: #FFFFFF; padding: 10px 15px; font-size: 18px; font-weight: bold; }
        #nav { background-color: #CCCCCC; border-bottom: 1px solid #000000; padding: 5px 15px; }
        #nav a { color: #000000; text-decoration: none; margin-right: 15px; font-weight: bold; }
        #nav a:hover { text-decoration: underline; color: #0000EE; }
        .container { width: 900px; margin: 20px auto; }
        h2 { color: #3B5998; border-bottom: 2px solid #3B5998; margin-top: 0; padding-bottom: 5px; }
        button { font-family: Verdana, sans-serif; font-size: 11px; background-color: #E0E0E0; border: 2px outset #FFFFFF; padding: 2px 8px; cursor: pointer; }
        button:active { border-style: inset; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background-color: #D3D3D3; border: 1px solid #000000; padding: 5px; text-align: left; }
        td { border: 1px solid #000000; padding: 5px; }
        .status-sudah { color: #008000; font-weight: bold; }
        .status-belum { color: #FF0000; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">Admin Panel - PAIBP SD</div>
    <div id="nav">
        <a href="index.html">[Home]</a>
        <a href="admin.html">[Admin]</a>
        <a href="analitik.html">[Analitik]</a>
        <a href="dashboard.html">[Dashboard]</a>
        <a href="progress.html">[Progress]</a>
        <a href="saran.html">[Saran]</a>
    </div>

    <div class="container">
        <h2>Data Pengerjaan Guru</h2>
        <button onclick="loadData()">Refresh Data</button>
        <span id="loading" style="color:red; font-weight:bold;"> Loading...</span>
        
        <table id="guruTable">
            <thead>
                <tr>
                    <th width="5%">No.</th>
                    <th width="35%">Materi</th>
                    <th width="30%">Nama Guru</th>
                    <th width="15%">Status</th>
                    <th width="15%">Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            document.getElementById('loading').style.display = 'inline';
            const { data, error } = await _supabase.from('material_analytics').select('*').order('id', { ascending: true });
            if (error) { alert('Error: ' + error.message); return; }

            let html = '';
            data.forEach((row, index) => {
                const materi = row.material_name.replace(/_/g, ' ').toUpperCase();
                const guru = row.guru ? row.guru : '-';
                const statusClass = row.sudah === 'Sudah' ? 'status-sudah' : 'status-belum';
                
                html += `<tr>
                    <td>${index + 1}</td>
                    <td>${materi}</td>
                    <td>${guru}</td>
                    <td class="${statusClass}">${row.sudah}</td>
                    <td><button onclick="updateStatus(${row.id}, '${row.sudah}')">Edit Status</button></td>
                </tr>`;
            });
            document.getElementById('tableBody').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
        }

        async function updateStatus(id, currentStatus) {
            const newVal = prompt("Masukkan Status Baru (Sudah / Belum):", currentStatus);
            if (newVal === "Sudah" || newVal === "Belum") {
                const { error } = await _supabase.from('material_analytics').update({ sudah: newVal }).eq('id', id);
                if (error) alert("Gagal update: " + error.message);
                else { alert("Sukses update data."); loadData(); }
            } else if (newVal !== null) {
                alert("Input tidak valid! Harus 'Sudah' atau 'Belum'.");
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
