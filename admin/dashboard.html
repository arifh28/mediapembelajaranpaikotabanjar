<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Progress Guru - PAIBP SD</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .stat-card {
            border: none;
            border-radius: 20px;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg fixed-top shadow-sm" style="background-color: var(--primary-green);">
        <div class="container">
            <div class="d-flex align-items-center">
                <a href="../index.html" class="nav-back-btn text-decoration-none">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <span class="page-title">Dashboard Monitoring</span>
            </div>
            
            <button onclick="fetchData()" class="btn btn-light text-success fw-bold rounded-pill ms-auto btn-sm">
                <i class="fas fa-sync-alt me-1"></i> Refresh Data
            </button>
        </div>
    </nav>
    <div style="height: 80px;"></div>

    <div class="container py-4">
        
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="icon-box bg-primary bg-opacity-10 text-primary me-3">
                            <i class="fas fa-users"></i>
                        </div>
                        <div>
                            <p class="text-muted mb-0 small fw-bold">TOTAL GURU</p>
                            <h3 class="fw-bold mb-0" id="totalGuru">0</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="icon-box bg-success bg-opacity-10 text-success me-3">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div>
                            <p class="text-muted mb-0 small fw-bold">SUDAH SELESAI</p>
                            <h3 class="fw-bold mb-0" id="totalSudah">0</h3>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm h-100">
                    <div class="card-body d-flex align-items-center p-4">
                        <div class="icon-box bg-warning bg-opacity-10 text-warning me-3">
                            <i class="fas fa-hourglass-half"></i>
                        </div>
                        <div>
                            <p class="text-muted mb-0 small fw-bold">BELUM SELESAI</p>
                            <h3 class="fw-bold mb-0" id="totalBelum">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card custom-card shadow-sm h-100">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                        <h5 class="fw-bold"><i class="fas fa-chart-pie me-2 text-primary"></i> Progress Keseluruhan</h5>
                        <p class="text-muted small">Persentase guru yang sudah menuntaskan materi.</p>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center position-relative">
                        <div class="chart-container" style="height: 250px;">
                            <canvas id="pieChart"></canvas>
                        </div>
                        <div class="position-absolute top-50 start-50 translate-middle text-center" style="pointer-events: none;">
                            <h2 class="fw-bold mb-0 text-dark" id="persenGlobal">0%</h2>
                            <small class="text-muted">Tuntas</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card custom-card shadow-sm h-100">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0">
                        <h5 class="fw-bold"><i class="fas fa-chart-bar me-2 text-success"></i> Progress Per Kecamatan</h5>
                        <p class="text-muted small">Persentase penyelesaian berdasarkan wilayah.</p>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 1. KONFIGURASI SUPABASE
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Variabel Chart agar bisa diupdate
        let myPieChart = null;
        let myBarChart = null;

        // Peta Nama Kecamatan & Warna
        const mapKecamatan = {
            1: { nama: 'Banjar', color: '#4ECDC4' },      // Hijau Tosca
            2: { nama: 'Pataruman', color: '#FFE66D' },   // Kuning
            3: { nama: 'Langensari', color: '#FF6B6B' },  // Merah/Pink
            4: { nama: 'Purwaharja', color: '#1A535C' }   // Biru Gelap
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        async function fetchData() {
            // Ambil semua data dari Supabase
            const { data, error } = await _supabase
                .from('material_analytics')
                .select('sudah, kecamatan');

            if (error) {
                console.error("Gagal ambil data:", error);
                alert("Gagal memuat data dashboard.");
                return;
            }

            processData(data);
        }

        function processData(data) {
            // --- A. Hitung Statistik Global ---
            const total = data.length;
            const countSudah = data.filter(r => r.sudah === 'Sudah').length;
            const countBelum = total - countSudah;
            const persentase = total > 0 ? Math.round((countSudah / total) * 100) : 0;

            // Update UI Teks
            document.getElementById('totalGuru').innerText = total;
            document.getElementById('totalSudah').innerText = countSudah;
            document.getElementById('totalBelum').innerText = countBelum;
            document.getElementById('persenGlobal').innerText = persentase + "%";

            // Update Pie Chart
            renderPieChart(countSudah, countBelum);

            // --- B. Hitung Statistik Per Kecamatan ---
            // Inisialisasi counter per kecamatan
            // Format: { '1': {total:0, sudah:0}, '2': ... }
            let statsKec = {}; 
            [1, 2, 3, 4].forEach(id => {
                statsKec[id] = { total: 0, sudah: 0 };
            });

            // Loop data untuk mengisi counter
            data.forEach(row => {
                const idKec = row.kecamatan;
                if (statsKec[idKec]) { // Pastikan ID valid (1-4)
                    statsKec[idKec].total++;
                    if (row.sudah === 'Sudah') {
                        statsKec[idKec].sudah++;
                    }
                }
            });

            // Siapkan Data untuk Chart.js
            const labels = [];
            const dataPersen = [];
            const backgroundColors = [];
            const rawData = []; // Untuk tooltip (misal: 5/10 guru)

            // Urutkan 1 sampai 4
            [1, 2, 3, 4].forEach(id => {
                const info = statsKec[id];
                const nama = mapKecamatan[id].nama;
                const warna = mapKecamatan[id].color;
                
                // Hitung % (Jika total 0, persen 0)
                const persen = info.total > 0 ? Math.round((info.sudah / info.total) * 100) : 0;

                labels.push(nama);
                dataPersen.push(persen);
                backgroundColors.push(warna);
                rawData.push(`${info.sudah} dari ${info.total} Guru`);
            });

            // Update Bar Chart
            renderBarChart(labels, dataPersen, backgroundColors, rawData);
        }

        // --- C. Fungsi Render Grafik ---

        function renderPieChart(sudah, belum) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            
            if (myPieChart) myPieChart.destroy(); // Hapus chart lama jika ada

            myPieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Sudah Tuntas', 'Belum Tuntas'],
                    datasets: [{
                        data: [sudah, belum],
                        backgroundColor: ['#4ECDC4', '#EEEEEE'], // Hijau & Abu-abu
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%', // Lubang tengah donat
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function renderBarChart(labels, dataValues, colors, tooltipsData) {
            const ctx = document.getElementById('barChart').getContext('2d');

            if (myBarChart) myBarChart.destroy();

            myBarChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Persentase Tuntas (%)',
                        data: dataValues,
                        backgroundColor: colors,
                        borderRadius: 10, // Bar melengkung
                        barThickness: 40, // Lebar bar
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100, // Mentok di 100%
                            ticks: { callback: (value) => value + '%' }
                        },
                        x: {
                            grid: { display: false } // Hilangkan garis grid vertikal
                        }
                    },
                    plugins: {
                        legend: { display: false }, // Sembunyikan legenda karena warna beda-beda
                        tooltip: {
                            callbacks: {
                                // Kustom tooltip: Tampilkan "5 dari 10 Guru"
                                label: function(context) {
                                    const index = context.dataIndex;
                                    const persen = context.raw;
                                    const detail = tooltipsData[index];
                                    return `${persen}% (${detail})`;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
