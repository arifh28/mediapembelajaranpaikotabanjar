<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Analisa</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Verdana, Arial, sans-serif; background-color: #FFFFFF; color: #000000; margin: 0; padding: 0; font-size: 12px; }
        #header { background-color: #3B5998; color: #FFFFFF; padding: 10px 15px; font-size: 18px; font-weight: bold; }
        #nav { background-color: #CCCCCC; border-bottom: 1px solid #000000; padding: 5px 15px; }
        #nav a { color: #000000; text-decoration: none; margin-right: 15px; font-weight: bold; }
        #nav a:hover { text-decoration: underline; color: #0000EE; }
        .container { width: 900px; margin: 20px auto; }
        h2 { color: #3B5998; border-bottom: 2px solid #3B5998; margin-top: 0; padding-bottom: 5px; text-align: center;}
        .chart-box { background-color: #F8F8F8; border: 1px solid #000000; margin-bottom: 30px; padding: 15px; text-align: center; }
    </style>
</head>
<body>
    <div id="header">Admin Panel - PAIBP SD</div>
    <div id="nav">
        <a href="index.html">[Home]</a>
        <a href="admin.html">[Admin]</a>
        <a href="analitik.html">[Analitik]</a>
        <a href="dashboard.html">[Dashboard]</a>
        <a href="progress.html">[Progress]</a>
        <a href="saran.html">[Saran]</a>
    </div>

    <div class="container">
        
        <div class="chart-box">
            <h2>Progress Keseluruhan (Global)</h2>
            <div style="height: 350px; width: 100%; display: flex; justify-content: center;">
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <div class="chart-box">
            <h2>Persentase Tuntas per Kecamatan</h2>
            <div style="height: 350px; width: 100%;">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://oisrtlcxdwgvzrxrlzpb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pc3J0bGN4ZHdndnpyeHJsenBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMzM3OTEsImV4cCI6MjA3ODYwOTc5MX0.aI162olkIydnJrRxLnC0NsBU9umySmd2nWSTt8Hc1ec'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Ubah Font Default Chart ke Verdana Hitam Peat
        Chart.defaults.color = '#000000'; 
        Chart.defaults.font.family = "Verdana, Arial, sans-serif";
        Chart.defaults.font.weight = "bold";

        async function fetchData() {
            const { data, error } = await _supabase.from('material_analytics').select('sudah, kecamatan');
            if (error) return alert("Error: " + error.message);

            let countSudah = 0, countBelum = 0;
            let statsKec = { 1: {t:0, s:0}, 2: {t:0, s:0}, 3: {t:0, s:0}, 4: {t:0, s:0} };

            data.forEach(r => {
                if (r.sudah === 'Sudah') countSudah++; else countBelum++;
                if (statsKec[r.kecamatan]) {
                    statsKec[r.kecamatan].t++;
                    if (r.sudah === 'Sudah') statsKec[r.kecamatan].s++;
                }
            });

            // PIE CHART - WARNA BIRU TUA & MERAH TERANG (KONTRAST TINGGI)
            new Chart(document.getElementById('pieChart').getContext('2d'), {
                type: 'pie',
                data: {
                    labels: ['SUDAH SELESAI', 'BELUM SELESAI'],
                    datasets: [{
                        data: [countSudah, countBelum],
                        backgroundColor: ['#0000FF', '#FF0000'], // Pure Blue & Pure Red
                        borderColor: '#000000',
                        borderWidth: 2
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // BAR CHART - WARNA MENColok
            const labels = ['Banjar', 'Pataruman', 'Langensari', 'Purwaharja'];
            const barData = [1, 2, 3, 4].map(id => statsKec[id].t > 0 ? Math.round((statsKec[id].s / statsKec[id].t) * 100) : 0);
            const barColors = ['#FF00FF', '#FFFF00', '#00FF00', '#FF9900']; // Magenta, Pure Yellow, Lime Green, Bright Orange

            new Chart(document.getElementById('barChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Persentase (%)',
                        data: barData,
                        backgroundColor: barColors,
                        borderColor: '#000000',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: '#000000' } },
                        x: { grid: { color: '#000000' } }
                    }
                }
            });
        }
        window.onload = fetchData;
    </script>
</body>
</html>
