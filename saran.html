<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kritik & Saran - PAIBP SD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-success navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-arrow-left me-2"></i>Kembali</a>
            <span class="navbar-text text-white fw-bold">Papan Suara Pengguna</span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-success">Kritik, Saran & Tanggapan</h2>
            <p class="text-muted">Terima kasih atas masukan Anda. Berikut adalah tanggapan dari tim kami.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8" id="saranContainer">
                <div class="text-center"><i class="fas fa-spinner fa-spin fa-3x text-success"></i></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('saranContainer');
            
            try {
                // Ambil data dari Supabase, urutkan dari yang terbaru
                const { data, error } = await _supabase
                    .from('kritik_saran')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = ''; // Kosongkan loading

                if (data.length === 0) {
                    container.innerHTML = '<div class="alert alert-info text-center">Belum ada saran yang masuk.</div>';
                    return;
                }

                data.forEach(item => {
                    // Format Tanggal
                    const tgl = new Date(item.created_at).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
                    
                    // Cek apakah ada jawaban admin
                    let jawabanHTML = '';
                    if (item.jawaban_admin) {
                        jawabanHTML = `
                            <hr class="opacity-25 my-3">
                            <div class="bg-light p-3 rounded-3 border-start border-4 border-success">
                                <small class="text-success fw-bold d-block mb-1"><i class="fas fa-headset me-1"></i> Balasan Admin:</small>
                                <p class="mb-0 text-dark small">${item.jawaban_admin}</p>
                            </div>
                        `;
                    }

                    // Render Kartu (Nama Pengirim Disamarkan)
                    container.innerHTML += `
                        <div class="card border-0 shadow-sm rounded-4 mb-4">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="badge bg-secondary rounded-pill px-3"><i class="fas fa-user-secret me-1"></i> Pengguna Anonim</span>
                                    <small class="text-muted"><i class="fas fa-calendar-alt me-1"></i> ${tgl}</small>
                                </div>
                                <p class="card-text fs-5">"${item.saran}"</p>
                                ${jawabanHTML}
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="alert alert-danger">Gagal memuat data.</div>';
            }
        });
    </script>
</body>
</html>
