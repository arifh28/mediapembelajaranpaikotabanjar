<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Papan Suara Pengguna dan Tanggapan Tim PAIBP SD.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Glassmorphism -->
    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
        <div class="container">
            <a href="index.html" class="navbar-brand d-flex align-items-center">
                <img src="assets/logo.png" alt="Logo" width="40" height="40" class="me-2">
                <span class="text-primary fs-4">PAIBP <span class="text-success">SD</span></span>
            </a>
            
            <button class="navbar-toggler border-0 p-1 text-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                <i class="fas fa-bars fa-lg"></i>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
                <div class="offcanvas-header bg-light">
                    <h5 class="offcanvas-title font-heading text-primary">Menu Utama</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                
                <div class="offcanvas-body d-flex flex-column flex-lg-row align-items-lg-center w-100">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link" href="buku.html">Buku Paket</a></li>
                        <li class="nav-item"><a class="nav-link" href="posts.html">Ruang Baca</a></li>
                        <li class="nav-item"><a class="nav-link" href="banksoal.html">Bank Soal</a></li>
                    </ul>

                    <div id="authContainer" class="mt-3 mt-lg-0">
                        <button onclick="loginGoogle()" class="btn btn-outline-primary rounded-pill px-4 fw-bold w-100">
                            <i class="fab fa-google me-2"></i> Masuk
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div style="height: 90px;"></div>

    <div class="container pb-5 pt-3 flex-grow-1">
        
        <!-- Hero Section -->
        <div class="hero-section p-4 p-md-5 mb-5 shadow-sm text-center position-relative" style="background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-green) 100%);">
            <a href="index.html" class="btn btn-light rounded-circle position-absolute top-50 start-0 translate-middle-y ms-3 ms-md-4 shadow-sm" style="z-index: 10;">
                <i class="fas fa-arrow-left text-primary"></i>
            </a>
            <h1 class="display-5 fw-bolder mb-2 text-white font-heading">Kritik & Saran</h1>
            <p class="fs-5 mb-0 text-white opacity-75">Papan Suara Pengguna dan Tanggapan Tim</p>
        </div>

        <!-- Wadah List Saran -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-8" id="saranContainer">
                <div class="text-center py-5">
                    <i class="fas fa-spinner fa-spin fa-3x text-primary mb-3"></i>
                    <p class="text-muted fw-bold">Memuat suara pengguna...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="main-footer text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 fw-bold text-dark">&copy; KKG PAI SD Kota Banjar Jawa Barat 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Pastikan script.js terhubung karena konfigurasi Supabase Anda ada di sana -->
    <script src="script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('saranContainer');
            
            try {
                // Ambil data dari Supabase, urutkan dari yang terbaru
                const { data, error } = await _supabase
                    .from('kritik_saran')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = ''; // Kosongkan loading

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="bento-card text-center p-5 border-0">
                            <i class="fas fa-comment-slash fa-3x text-muted opacity-25 mb-3"></i>
                            <h5 class="text-muted font-heading">Belum ada saran yang masuk.</h5>
                        </div>`;
                    return;
                }

                data.forEach(item => {
                    // Format Tanggal
                    const tgl = new Date(item.created_at).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
                    
                    // Cek apakah ada jawaban admin
                    let jawabanHTML = '';
                    if (item.jawaban_admin) {
                        jawabanHTML = `
                            <hr class="opacity-10 my-3">
                            <div class="bg-light p-3 rounded-4 border-start border-4 border-success">
                                <small class="text-success fw-bold d-block mb-1"><i class="fas fa-headset me-1"></i> Balasan Admin:</small>
                                <p class="mb-0 text-dark small">${item.jawaban_admin}</p>
                            </div>
                        `;
                    }

                    // Render Kartu menggunakan style Bento Card
                    container.innerHTML += `
                        <div class="bento-card p-4 mb-4 border-0">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="badge bg-light text-primary border rounded-pill px-3 py-2"><i class="fas fa-user-secret me-1"></i> Pengguna Anonim</span>
                                <small class="text-muted fw-bold"><i class="fas fa-calendar-alt me-1"></i> ${tgl}</small>
                            </div>
                            <p class="card-text fs-5" style="color: var(--dark-text);">"${item.saran}"</p>
                            ${jawabanHTML}
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="alert alert-danger rounded-4 border-0 shadow-sm text-center">
                        <i class="fas fa-exclamation-triangle me-2"></i> Gagal memuat data saran dan kritik.
                    </div>`;
            }
        });
    </script>
</body>
</html>
